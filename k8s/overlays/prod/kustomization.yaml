apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cooknco

resources:
- namespace.yaml
- ../../base

# The three app images track `latest`, which every master build repoints at the
# commit it just pushed. Nothing rewrites this file any more: the deploy job
# stamps the built version into `commonAnnotations` instead, which is what makes
# `kubectl apply` see a changed pod template and roll the Deployments over. The
# containers carry `imagePullPolicy: Always`, so the new pods pull the tag fresh.
images:
- name: xavierclavel/cooknco-backend
  newTag: latest
- name: xavierclavel/cooknco-frontend
  newTag: latest
- name: xavierclavel/cooknco-mail-service
  newTag: latest
