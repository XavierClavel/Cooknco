apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cooknco-users
  labels:
    strimzi.io/cluster: kafka-kraft
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cooknco-recipes
  labels:
    strimzi.io/cluster: kafka-kraft
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cooknco-pictures
  labels:
    strimzi.io/cluster: kafka-kraft
spec:
  partitions: 3
  replicas: 1
---
# Every mail the application sends, one record per recipient, keyed by recipient id so
# that two mails to the same person keep their order. The partition count is also the
# ceiling on how many mail-service replicas can usefully share the work.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cooknco-mails
  labels:
    strimzi.io/cluster: kafka-kraft
spec:
  partitions: 3
  replicas: 1
