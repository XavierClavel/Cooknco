apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Strimzi's topic operator only reconciles KafkaTopic resources in the namespace
# of the Kafka cluster it manages (`kafka-kraft` in namespace `kafka`), so these
# cannot live under the app overlay. Applied as a separate root by CI.
namespace: kafka

resources:
  - topics.yaml
