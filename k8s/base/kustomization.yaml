apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Image tags are intentionally absent here: the overlay's `images:` block is the
# single source of truth for which tag each app image runs.
resources:
  - pvc.yaml
  - database.yaml
  - redis.yaml
  - backend.yaml
  - gotenberg.yaml
  - frontend.yaml
  - mail-service-db.yaml
  - mail-service.yaml
  - certificate.yaml
  - ingress.yaml

# includeSelectors: false — never inject these into Deployment selectors, which
# are immutable once created.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: cooknco
      app.kubernetes.io/managed-by: kustomize
