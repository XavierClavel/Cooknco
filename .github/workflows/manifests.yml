name: Kubernetes Manifests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'k8s/**'
      - '.github/workflows/manifests.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'k8s/**'
      - '.github/workflows/manifests.yml'
  workflow_dispatch:

env:
  KUSTOMIZE_VERSION: '5.7.1'
  KUBECONFORM_VERSION: '0.7.0'
  # Kubernetes API version the manifests are validated against.
  KUBERNETES_VERSION: '1.31.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay:
          - k8s/overlays/prod
          - k8s/kafka-topics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render ${{ matrix.overlay }}
        run: |
          kustomize build "${{ matrix.overlay }}" > rendered.yaml
          echo "::group::rendered manifests"
          cat rendered.yaml
          echo "::endgroup::"

      - name: Validate against Kubernetes and CRD schemas
        run: |
          # Second -schema-location resolves out-of-tree CRDs (cert-manager
          # Certificate, Strimzi KafkaTopic) from the CRDs-catalog.
          kubeconform \
            -strict \
            -summary \
            -verbose \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - name: Check every image reference carries an explicit tag
        run: |
          # A bare or :latest tag makes a rollout unreproducible and breaks
          # rollback, so fail the build instead of shipping it.
          bad=0
          while read -r image; do
            case "$image" in
              *:latest) echo "::error::$image uses the mutable :latest tag"; bad=1 ;;
              *:*)      echo "ok: $image" ;;
              *)        echo "::error::$image has no tag"; bad=1 ;;
            esac
          done < <(grep -oE 'image: [^ ]+' rendered.yaml | cut -d' ' -f2)
          exit $bad
