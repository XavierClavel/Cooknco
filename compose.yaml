name: cooknco

# The whole application on one machine.
#
# Production runs on Kubernetes (`k8s/`, deployed by `.github/workflows/build.yml`);
# this file is not a deployment path, it is the local stack, so it mirrors the k8s
# topology rather than the retired single-VPS deploy it grew out of.
#
# The two JVM images copy a jar the Gradle build already produced, exactly as CI
# builds them (the frontend image runs npm itself), so build first, then bring the
# stack up:
#
#     ./gradlew build          # backend-all.jar, mail-service-all.jar
#     docker compose up --build
#
# Then open http://localhost (not 127.0.0.1: the session cookie is SameSite=Lax).
# Default admin is admin@mail.com / Passw0rd.
#
# Container names are load-bearing: `backend/src/main/resources/db.properties`, the
# `redis.url` default in `appModules.kt` and the `proxy_pass` targets in
# `frontend/nginx.conf` all address these hosts by name.

services:
  backend:
    container_name: cooknco-backend
    build:
      # The Dockerfile copies build/libs/backend-all.jar, so the context is the
      # module — same as the `docker build ... $project` loop in CI.
      context: backend
    # Left empty compose drops the key and the image runs native, which is what you
    # want. The exception is serving images on an arm64 machine: the libwebp-imageio
    # native library shipped in the dependency jar is x86_64 only, so every /image/
    # request answers 500 with an UnsatisfiedLinkError. `BACKEND_PLATFORM=linux/amd64`
    # buys working images back at the price of an emulated JVM.
    platform: ${BACKEND_PLATFORM:-}
    restart: unless-stopped
    volumes:
      - pictures:/img
      - logs:/var/log/cooknco
      # Only application.yaml lives here. No db.properties: without one the backend
      # falls back to the copy in its own resources, which already points at
      # cooknco-database with the credentials `database` is started with below.
      - ./config:/app/config:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
      KAFKA_BOOTSTRAP_SERVERS: cooknco-kafka:9092
    ports:
      # Published only for poking at the API directly; the browser reaches it
      # through nginx on :80. 8080 is a busy port on dev machines, hence 8081.
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - database-network
      - frontend-network
      - auth-network
      - event-network
      - render-network
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not optional: the first event is produced during startup, and
      # KafkaEventProducer throws when KAFKA_BOOTSTRAP_SERVERS is unset or dead.
      kafka:
        condition: service_healthy
      # Only the PDF export needs it, and that answers 503 without it rather than
      # failing to start — but waiting means the first export of a fresh stack works.
      gotenberg:
        condition: service_healthy

  # Headless Chromium behind an HTTP form: what actually prints a recipe sheet.
  #
  # A document layout is markup an operator saved in the backoffice, so the browser
  # printing it must not become a way to reach the rest of the stack. The two deny
  # flags leave the page with no network at all — the only files it can read are the
  # ones the backend posts alongside it — and the internal network it sits on, shared
  # with the backend and nothing else, is the second lock.
  gotenberg:
    container_name: cooknco-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      # Allow-list rather than the stock deny-list: that default is
      # `^file:(?!//\/tmp/).*`, a negative lookahead, which Go's RE2 cannot compile — so
      # Gotenberg matches it on a backtracking engine with a timeout, and under concurrent
      # prints that timeout fires and the conversion 500s. This says the same thing (only
      # the files posted with the document, which land under /tmp) in linear-time regex.
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-list=^$$
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
    networks:
      - render-network
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    container_name: cooknco-frontend
    build:
      context: frontend
      args:
        # Vite inlines these at build time. Unset — which is how CI builds the
        # image — the committed .env.production values (the public site) apply, so
        # they have to be named here for the SPA to call the backend next door.
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
        VITE_IMG_URL: ${VITE_IMG_URL:-http://localhost/image}
    restart: unless-stopped
    ports:
      # nginx.conf has a single `listen 80` server. TLS is terminated upstream —
      # by the ingress and cert-manager in k8s (see k8s/base/certificate.yaml) —
      # so there is nothing here to publish 443 for.
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - frontend-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  database:
    container_name: cooknco-database
    image: postgres:17.2
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Fixed, not parameterised: these have to agree with
      # backend/src/main/resources/db.properties, which is a static file the
      # backend reads and no environment variable can retarget.
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeit
    networks:
      - database-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: cooknco-redis
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-localdev}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
    healthcheck:
      # `redis-cli ping` answers NOAUTH and still exits 0, so an unauthenticated
      # ping reports healthy whatever the password is. Read the reply instead.
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    container_name: cooknco-kafka
    # Single-node KRaft stand-in for the Strimzi cluster the k8s deployment talks
    # to. The topics in k8s/kafka-topics are created on first use here, since a
    # broker left at its defaults auto-creates them.
    image: apache/kafka:3.9.1
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - event-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cooknco-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cooknco-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mail-service:
    container_name: cooknco-mail-service
    build:
      context: mail-service
    restart: unless-stopped
    environment:
      JDBC_URL: jdbc:postgresql://cooknco-mail-database:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeit
      KAFKA_BOOTSTRAP_SERVERS: cooknco-kafka:9092
      # Where the backoffice-managed mail wordings are read from. Cluster-internal
      # in k8s, and equally unpublished here: nginx proxies no /internal/ prefix.
      BACKEND_INTERNAL_URL: http://cooknco-backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Must match encryption.key in config/application.yaml: the backend encrypts
      # the verification token this service puts in the link.
      AES_KEY: ${AES_KEY:-6r5HI1W9n4U3tOMS}
      # Mail.kt sends through smtp.gmail.com and reads these on class init, so they
      # have to be set — empty is fine, sending then just fails and logs.
      COOKNCO_SMTP_ADDRESS: ${COOKNCO_SMTP_ADDRESS:-}
      COOKNCO_SMTP_PASSWORD: ${COOKNCO_SMTP_PASSWORD:-}
    networks:
      - mail-network
      - event-network
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mail-database:
        condition: service_healthy
      kafka:
        condition: service_healthy

  mail-database:
    container_name: cooknco-mail-database
    image: postgres:17.2
    restart: unless-stopped
    volumes:
      - mail_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeit
    networks:
      - mail-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pictures: {}
  logs: {}
  postgres_data: {}
  mail_postgres_data: {}
  redis_data: {}
  kafka_data: {}

networks:
  # The only network reachable from outside: nginx publishes a port on it, and it
  # is how the browser's /api/ and /image/ calls reach the backend.
  frontend-network: {}
  database-network:
    internal: true
  auth-network:
    internal: true
  mail-network:
    internal: true
  # Kafka, plus the one direct call mail-service makes back to the backend.
  event-network:
    internal: true
  # The backend and the browser that prints its PDFs. Nothing else belongs here.
  render-network:
    internal: true
