name: cooknco

services:
  backend:
    container_name: cooknco-backend
    build:
      context: .
    volumes:
      - pictures:/img
      - logs:/var/log/cooknco
      - /secrets/cooknco/db.properties:/app/config/db.properties:ro
      - /secrets/cooknco/application.properties:/app/config/application.yaml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - database-network
      - frontend-network
      - auth-network
    healthcheck:
      test: curl --fail http://localhost:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: cooknco-frontend
    build:
      context: frontend
    environment:
      # Runtime config, so one image serves every environment.
      NUXT_BACKEND_URL: http://cooknco-backend:8080
      NUXT_PUBLIC_SITE_URL: https://cooknco.eu
    ports:
      # The container listens on 3000 (it runs unprivileged); still published
      # on 80. The 443 mapping and the letsencrypt mount are gone with nginx,
      # which never had a `listen 443` block — TLS terminates upstream.
      - "80:3000"
    networks:
      - frontend-network
    healthcheck:
      # node:alpine ships no curl.
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  database:
    container_name: cooknco-database
    image: postgres:17.2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - database-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: cooknco-redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pictures: {}
  logs: {}
  postgres_data: {}
  redis_data: {}

networks:
  frontend-network: {}
  database-network:
    internal: true
  auth-network:
    driver: bridge
    internal: true