<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Connection refused &middot; Cook&amp;co</title>
  <style>
    :root { --ink: #2c2c2c; --muted: #6b6b6b; --line: #e4e0d8; --paper: #fbf9f5; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 30rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 12px; font-size: 1.3rem; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ece8e1; --muted: #a3a3a3; --line: #3a3a3a; --paper: #1c1c1c; }
      main { background: #242424; }
    }
  </style>
</head>
<body>
  <main>
    <h1>This connection cannot be made</h1>
    <p>{{message}}</p>
    <p class="muted">
      Nothing has been shared, and no access has been granted. You can close this page.
    </p>
  </main>
</body>
</html>
