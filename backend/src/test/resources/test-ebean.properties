# Each checkout gets its own database in the shared ebean test container, so
# concurrent checkouts/worktrees don't drop-create each other's schema.
# EBEAN_TEST_DBNAME is set per checkout by tasks.test in the root build.gradle.kts;
# runs without it (e.g. from the IDE) fall back to my_app.
# This lives here rather than application-test.yaml because hoplite also parses
# that yaml and rejects avaje-config ${...} expressions.
ebean.test.dbName=${EBEAN_TEST_DBNAME:my_app}
