ebean:
  test:
    platform: postgres
    ddlMode: dropCreate
    # dbName is set per checkout in test-ebean.properties
    postgres:
      version: 17.2
      # keep the container alive between runs: the default shutdown hook removes it
      # at JVM exit, racing (and breaking) any other test run using the same container
      shutdownMode: none
frontend:
  url: http://localhost:3000
backend:
  url: http://localhost:8080/api/v1
smtp:
  email: test
  password: test
encryption:
  key: 6r5HI1W9n4U3tOMS
  # The floor bcrypt allows, against 12 in production. Nothing here tests how expensive a
  # hash is to attack, and everything here pays for it: three hashes and a login per test,
  # ~300ms each at 12, which is most of what the suite spends. At 4 they are ~1ms.
  # The cost travels inside the hash, so verification is unchanged either way.
  password_cost: 4
oauth:
  google:
    client_id: test
    client_secret: test

images:
  # Small on purpose: it is what lets the ticket endpoint's size refusal be exercised
  # without moving twenty megabytes through the test client.
  max_upload_bytes: 65536

pdf:
  # Small for the same reason as max_upload_bytes above: the cookbook export refuses a book
  # past this, and a test that had to build a hundred recipes to reach the real bound would
  # spend a minute proving one `if`. Every other export test stays well under it.
  max_cookbook_recipes: 3
