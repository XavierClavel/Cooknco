ebean:
  test:
    platform: postgres
    ddlMode: dropCreate
    # dbName is set per checkout in test-ebean.properties
    postgres:
      version: 17.2
      # keep the container alive between runs: the default shutdown hook removes it
      # at JVM exit, racing (and breaking) any other test run using the same container
      shutdownMode: none
frontend:
  url: http://localhost:3000
backend:
  url: http://localhost:8080/api/v1
smtp:
  email: test
  password: test
encryption:
  key: 6r5HI1W9n4U3tOMS
oauth:
  google:
    client_id: test
    client_secret: test

images:
  # Small on purpose: it is what lets the ticket endpoint's size refusal be exercised
  # without moving twenty megabytes through the test client.
  max_upload_bytes: 65536
