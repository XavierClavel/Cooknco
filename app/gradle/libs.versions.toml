[versions]
agp = "9.2.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
# Compose Multiplatform ships Material 3 on its own version line;
# 1.9.0 is what the 1.11.1 plugin pins (see ComposeBuildConfig).
composeMaterial3 = "1.9.0"
# Last version of the multiplatform Material icon set JetBrains published.
# Icons are plain ImageVector data over stable APIs, so it resolves fine
# against newer Compose. There is no newer multiplatform build.
materialIconsExtended = "1.7.3"
androidxLifecycle = "2.9.6"
androidxNavigation = "2.9.2"
activityCompose = "1.13.0"
composeBom = "2026.02.01"
browser = "1.10.0"
core = "1.18.0"
# Firebase Cloud Messaging, for push notifications. The BOM pins every firebase-*
# artifact, so firebase-messaging is declared without a version of its own.
firebaseBom = "34.17.0"
googleServices = "4.5.0"
datastore = "1.2.1"
ktor = "3.5.2"
# Only the test artifact is declared: everything else pulls coroutines in transitively,
# and kotlinx-coroutines-test has to match the version they resolve to.
kotlinxCoroutines = "1.11.0"
coil = "3.5.0"
kotlinxSerializationJson = "1.9.0"
kotlinxDatetime = "0.8.0"
reorderable = "2.4.0"
okio = "3.18.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# ── Compose Multiplatform (common) ────────────────────────────────────────────
# Declared explicitly rather than through the `compose.*` Gradle DSL accessors,
# which are deprecated as of Compose Multiplatform 1.11.
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# ── Android only ──────────────────────────────────────────────────────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
# NotificationCompat, to draw a push while the app is in the foreground.
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# ── iOS only ──────────────────────────────────────────────────────────────────
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }

# ── Test ──────────────────────────────────────────────────────────────────────
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Reads androidApp/google-services.json into the resources Firebase initialises itself from.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
# AGP 9 refuses `com.android.application` in a Kotlin Multiplatform module; the
# KMP-aware library plugin is the supported way to give a KMP module an Android target.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
