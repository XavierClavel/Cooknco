limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

# Whether this request arrived over plain HTTP.
#
# TLS is terminated above this pod, which then forwards both entrypoints to the same port 80,
# so `$scheme` is always "http" here and the only thing that knows is the header the proxy
# sets. Empty when nothing set it — which is the local `docker compose` stack, and is what
# keeps http://localhost from redirecting to a host that does not exist on a laptop.
map $http_x_forwarded_proto $insecure_request {
    default 0;
    "http"  1;
}

# The canonical origin every other spelling of the site redirects to. One place, because
# three redirects pointing at three slightly different hosts is how a redirect loop is built.
map $host $canonical_origin {
    default "https://cooknco.eu";
}

# www is not the site, and never was: it has no certificate of its own (k8s/base/certificate.yaml
# names the apex alone), so before this block it answered with the ingress controller's
# self-signed default and then a 404 — a browser security warning on the way to nothing. It
# redirects rather than serving a copy, so there is one address for search engines to rank.
server {
    listen 80;
    server_name www.cooknco.eu;
    return 301 $canonical_origin$request_uri;
}

server {
    # default_server, now that there is a second block: without it nginx would pick whichever
    # block it saw first for a Host it does not recognise, and the local stack browses this
    # one as `localhost`.
    listen 80 default_server;
    server_name cooknco.eu;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA's catch-all, and the one place a page request can be redirected to HTTPS.
    #
    # In a location rather than at server level, where an `if` would run before nginx has
    # chosen one — and would therefore catch the ACME challenge below and fail a certificate
    # renewal with a 301. `robots.txt`, `sitemap.xml` and the API are matched by their own
    # locations and are deliberately not redirected: an API call answered with a 301 is a
    # client bug, not a fixed URL.
    location / {
        if ($insecure_request) {
            return 301 $canonical_origin$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # `^~`, so it beats both the regex locations below and the catch-all above. The challenge
    # is normally answered above this pod and never arrives here at all; if it ever does, it
    # has to be served as itself, because a 301 to HTTPS fails the validation and takes the
    # certificate with it.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    #Prevent uploading files larger than 20Mo
    client_max_body_size 20M;

    # The backoffice is a second SPA (admin.html) with its own history base,
    # so every /admin/* deep link has to fall back to that entry point rather
    # than the public app's index.html.
    location /admin {
        try_files $uri /admin.html;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # The public app routes people share. Answered by the backend rather than from disk, so
    # that the document carries the shared entity's own title, description and picture in its
    # og: tags: a crawler building a link preview reads the HTML and never runs the app, so
    # anything the SPA sets after mounting comes too late for it.
    #
    # Humans are served the same app as before — the response is this very index.html with
    # only the block between its <!--preview:*--> markers rewritten (the backend fetches the
    # shell back from here; see LinkPreviewController).
    #
    # One regex covers the four routes and both of the shapes in circulation
    # (`/recipe/view?id=1` but `/user/view/?user=1`). Anchored so it cannot swallow anything
    # deeper, and `proxy_pass` without a URI part forwards path and query string unchanged.
    location ~ ^/(recipe|user|cookbook|ingredient)/view/?$ {
        # Pages, like the catch-all above, so a link shared as http reaches the canonical
        # origin rather than being answered over plain HTTP.
        if ($insecure_request) {
            return 301 $canonical_origin$request_uri;
        }

        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short, because the fallback below is strictly better than a visitor waiting: these
        # are page loads, and the app does not need the backend to boot.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        # What keeps a sick backend from taking the public pages down with it. A refused
        # connection, a timeout, or the backend's own 502 when it cannot read the shell all
        # land on @app_shell, which serves the static index.html with a 200: the app still
        # works, only the entity's own preview tags are missing. An exceeded rate limit
        # answers 503 and degrades the same way, which is why no limit_req_status is set here.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @app_shell;

        limit_req zone=mylimit burst=20 nodelay;
    }

    # Reached only through the error_page above.
    location @app_shell {
        # Not cacheable, unlike the same file served from `/`: this is the *default*-tag
        # shell standing in for an entity URL. nginx sends only ETag/Last-Modified for a
        # static file, which lets a browser cache it heuristically — and a visitor who
        # happened to load a shared link during a backend blip would then keep the generic
        # preview and title long after the backend came back.
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # The backoffice-managed defaults, which are the only mutable name under /image/: every
    # other file carries its version in its filename, which is what earns the immutable
    # cache below. A regex location is matched ahead of the prefix one, so this wins.
    location ~ ^/image/[^/]+/default\.webp$ {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /image/ {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # The list of pages worth indexing, generated from the catalogue rather than shipped with
    # the SPA — a static file would name the recipes that existed at the last frontend build.
    #
    # `/sitemap.xml` is an index naming the three documents beside it, one per kind of page
    # (`SitemapService.SitemapDocument`). The regex is anchored and spells the three out, so it
    # publishes those four paths and nothing near them. Its companion `robots.txt` is *not*
    # here: it never changes, so it ships in public/ and the catch-all above serves it off
    # disk. Both used to fall through that catch-all to index.html and answer a crawler with a
    # page of HTML under a 200.
    location ~ ^/sitemap(-(pages|recipes|users))?\.xml$ {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The document is regenerated at most hourly and cached in the backend, so a burst
        # costs one pass over the catalogue rather than one per request. This bounds the rest.
        limit_req zone=mylimit burst=10 nodelay;
        limit_req_status 429;
    }

    # Server-sent events for the admin log tail. An exact-match location beats the
    # /api/ prefix below, which is what we want here: its default proxy_buffering would
    # hold the stream until it ended, and HTTP/1.0 upstream would close the connection
    # rather than keep it open.
    location = /api/v1/admin/logs/stream {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # A quiet server sends nothing but the 20s keep-alive comment, so the read
        # timeout only needs to outlast that comfortably
        proxy_read_timeout 1h;
    }

    # The Model Context Protocol endpoint, for MCP clients registered against this server. An
    # exact match, so it publishes that one route and nothing under it.
    #
    # A plain JSON POST — the endpoint is stateless and opens no SSE stream — so the defaults
    # above it are right, but a tool call runs a database query or two behind an LLM's request,
    # which is slower than an app call and worth its own read timeout. Rate limited like /api/:
    # every call is authenticated by a bearer token, and a client that loses its mind should not
    # be able to outpace the app for the backend's attention.
    location = /mcp {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;

        limit_req zone=mylimit burst=10 nodelay;
        limit_req_status 429;
    }

    # What the two mobile platforms read to decide whether the app may open cooknco.eu
    # links (see the app's AndroidManifest and iosApp.entitlements). Both are static files
    # under public/.well-known/, so they ship with the SPA and are served from disk by the
    # `/` location above; only the association file needs a block of its own, because it has
    # no extension and would otherwise go out as the default type. Apple's CDN fetches it
    # and refuses anything that is not application/json, so the link would silently stay in
    # Safari — the failure this block exists to prevent.
    #
    # An exact match, so it cannot shadow the acme-challenge path cert-manager answers on,
    # and nothing here reaches the backend: these files say what the apps may claim, and
    # that is a deployment fact rather than something the product answers per request.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # The OAuth 2.1 authorization server an MCP client is sent to, and the two discovery
    # documents that lead it there. Both prefixes have to be public: a client reads the metadata
    # and registers itself before it has any credentials at all.
    #
    # `/.well-known/oauth-` rather than `/.well-known/`, so this cannot shadow the
    # acme-challenge path cert-manager answers on when renewing the certificate.
    location /.well-known/oauth- {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=mylimit burst=10 nodelay;
        limit_req_status 429;
    }

    # /oauth/authorize and /oauth/decision are pages a person sees; /oauth/register and
    # /oauth/token are called by the client. The login_limit zone rather than mylimit: these
    # carry credentials and codes, and nothing legitimate calls them in bursts.
    location /oauth/ {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
    }

    # The prefixes proxied here are also what keeps the backend's internal routes private.
    # Nothing outside /api/, /image/, /mcp, /oauth/, the two oauth metadata documents and the
    # stream above reaches the backend at all, which is what /internal/ (read by mail-service,
    # not by browsers) relies on: adding a broader location, or one for /internal/, would
    # publish it.
    location /api/ {
        proxy_pass http://cooknco-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=mylimit burst=10 nodelay;
        limit_req_status 429;
    }

    # Serve static assets with caching
    #location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg)$ {
    #    expires 6M;
    #    access_log off;
    #    add_header Cache-Control "public, max-age=15552000, immutable";
    #}

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}