<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!--
      Everything between the two markers below is the head block the backend swaps out when
      it serves this document for a shared entity link — see LinkPreviewService and the
      `location`s in nginx.conf. Crawlers never run the app's JavaScript, so tags set after
      mounting come too late for them; what is written here is what a bare link to the site
      or to any route nginx does not send to the backend previews as.

      Keep the markers, and keep the tags between them self-contained: the backend replaces
      the whole region, so anything in here that must survive on an entity page has to live
      outside it (and be rendered by LinkPreviewService.renderHead too).
    -->
    <!--preview:start-->
    <title>Cook&amp;Co</title>
    <meta name="description" content="Share your recipes, build your cookbooks and follow your friends on Cook&amp;Co.">
    <meta property="og:site_name" content="Cook&amp;Co">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cook&amp;Co">
    <meta property="og:description" content="Share your recipes, build your cookbooks and follow your friends on Cook&amp;Co.">
    <meta property="og:url" content="https://cooknco.eu">
    <meta property="og:image" content="https://cooknco.eu/og-default.png">
    <meta property="og:image:alt" content="Cook&amp;Co">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cook&amp;Co">
    <meta name="twitter:description" content="Share your recipes, build your cookbooks and follow your friends on Cook&amp;Co.">
    <meta name="twitter:image" content="https://cooknco.eu/og-default.png">
    <!--preview:end-->

    <!--
      Outside the markers on purpose, so it survives the swap above and every page carries it.
      What it says is true of the site whatever entity is being previewed, and a recipe page
      adds its own Recipe document next to this one rather than replacing it
      (LinkPreviewService.recipeJsonLd).

      It is here rather than in the backend because none of it is a fact about a request: the
      name, the mark and the accounts are the same for every visitor, and a constant the
      backend renders is a constant two services have to agree on.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cook&Co",
      "alternateName": "Cooknco",
      "url": "https://cooknco.eu",
      "logo": "https://cooknco.eu/logo.png",
      "description": "Share your recipes, build your cookbooks and follow your friends on Cook&Co."
    }
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
